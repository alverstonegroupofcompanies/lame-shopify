<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebf5fb" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <radialGradient id="frostGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.08" />
    </filter>
    <filter id="tagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&amp;family=Montserrat:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .title-kicker { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; fill: #0284c7; }
      .title-main { font-family: 'Playfair Display', Georgia, serif; font-size: 38px; font-weight: 700; fill: #0c4a6e; letter-spacing: -0.015em; }
      .title-italic { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; fill: #0284c7; }
      .title-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 13.5px; fill: #475569; letter-spacing: 0.01em; }
      .tag-text { font-family: 'Montserrat', 'Inter', sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.08em; }
    </style>
  </defs>

  <!-- Banner Outer Card with Soft Shadow -->
  <rect x="4" y="4" width="1192" height="212" rx="18" fill="url(#bgGrad)" stroke="#bae6fd" stroke-width="1.2" filter="url(#softShadow)" />
  <rect x="4" y="4" width="1192" height="212" rx="18" fill="url(#frostGlow)" />

  <!-- Decorative Snowflake Elements -->
  <!-- Top Left Snowflake -->
  <g transform="translate(60, 40) scale(0.9)" opacity="0.28" stroke="#0284c7" stroke-width="1.8" fill="none">
    <line x1="0" y1="-22" x2="0" y2="22" />
    <line x1="-22" y1="0" x2="22" y2="0" />
    <line x1="-15.5" y1="-15.5" x2="15.5" y2="15.5" />
    <line x1="-15.5" y1="15.5" x2="15.5" y2="-15.5" />
    <circle cx="0" cy="0" r="3" fill="#0284c7" />
  </g>

  <!-- Top Right Snowflake -->
  <g transform="translate(1135, 45) scale(0.8)" opacity="0.25" stroke="#0284c7" stroke-width="1.8" fill="none">
    <line x1="0" y1="-20" x2="0" y2="20" />
    <line x1="-20" y1="0" x2="20" y2="0" />
    <line x1="-14" y1="-14" x2="14" y2="14" />
    <line x1="-14" y1="14" x2="14" y2="-14" />
    <circle cx="0" cy="0" r="2.5" fill="#0284c7" />
  </g>

  <!-- Bottom Left Snowflake -->
  <g transform="translate(110, 165) scale(0.65)" opacity="0.22" stroke="#0284c7" stroke-width="1.6" fill="none">
    <line x1="0" y1="-18" x2="0" y2="18" />
    <line x1="-18" y1="0" x2="18" y2="0" />
    <circle cx="0" cy="0" r="2" fill="#0284c7" />
  </g>

  <!-- Bottom Right Snowflake -->
  <g transform="translate(1080, 160) scale(0.7)" opacity="0.22" stroke="#0284c7" stroke-width="1.6" fill="none">
    <line x1="0" y1="-18" x2="0" y2="18" />
    <line x1="-18" y1="0" x2="18" y2="0" />
    <circle cx="0" cy="0" r="2" fill="#0284c7" />
  </g>

  <!-- Center Content -->
  <!-- Eyebrow Kicker -->
  <text x="600" y="68" text-anchor="middle" class="title-kicker">❄ COLD-WEATHER CURATION • EXCLUSIVE WINTER EDIT</text>

  <!-- Main Headline with Italic Luxury Flourish -->
  <text x="600" y="118" text-anchor="middle" class="title-main">
    Winter <tspan class="title-italic">Care</tspan> Essentials
  </text>

  <!-- Subtitle -->
  <text x="600" y="154" text-anchor="middle" class="title-sub">
    Dermatologist-recommended cold-weather hydration &amp; deep barrier repair from our top featured brands
  </text>
</svg>